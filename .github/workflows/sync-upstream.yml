name: Sync Upstream and Refresh Plugins

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      skip_upstream:
        description: "跳过上游同步，只刷新插件"
        type: boolean
        default: false
      skip_plugins:
        description: "跳过插件刷新，只同步上游"
        type: boolean
        default: false

concurrency:
  group: sync-upstream-and-refresh
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT != '' && secrets.PAT || github.token }}
          ref: master
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Sync upstream
        if: ${{ !inputs.skip_upstream }}
        id: upstream
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/wukongdaily/store.git 2>/dev/null || git remote set-url upstream https://github.com/wukongdaily/store.git
          git fetch upstream master
          COMMIT_COUNT="$(git rev-list --count master..upstream/master)"
          echo "commit_count=${COMMIT_COUNT}" >> "$GITHUB_OUTPUT"
          if [ "$COMMIT_COUNT" -eq 0 ]; then
            echo "No new upstream commits."
            echo "synced=false" >> "$GITHUB_OUTPUT"
            echo "conflict=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "New upstream commits: ${COMMIT_COUNT}"
          if git merge -X theirs --no-edit -m "chore: auto-sync from wukongdaily/store" upstream/master; then
            echo "synced=true" >> "$GITHUB_OUTPUT"
            echo "conflict=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Merge reported conflicts, taking upstream for remaining paths."
          git checkout --theirs -- . || true
          git add -A
          git commit --no-edit -m "chore: auto-sync from wukongdaily/store" || true
          echo "synced=true" >> "$GITHUB_OUTPUT"
          echo "conflict=true" >> "$GITHUB_OUTPUT"

      - name: Run plugin matcher tests
        if: ${{ !inputs.skip_plugins }}
        run: node --test scripts/refresh-run-plugins.test.js

      - name: Refresh run plugins
        if: ${{ !inputs.skip_plugins }}
        id: refresh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/refresh-run-plugins.js --apply --summary-file "$GITHUB_STEP_SUMMARY"

      - name: Commit plugin refresh
        if: ${{ !inputs.skip_plugins }}
        run: |
          set -euo pipefail
          git add run
          if git diff --cached --quiet; then
            echo "No plugin file changes."
            exit 0
          fi
          TAG="${{ steps.refresh.outputs.release_tag }}"
          git commit -m "chore: refresh run plugins from CloudRunFilesBuilder ${TAG}"

      - name: Push changes
        run: |
          set -euo pipefail
          AHEAD="$(git rev-list --count origin/master..HEAD)"
          if [ "$AHEAD" -eq 0 ]; then
            echo "Nothing to push."
            exit 0
          fi
          git push origin HEAD:master